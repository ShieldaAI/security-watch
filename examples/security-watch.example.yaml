version: 1
inventory: ./systems.example.yaml
database: ./data/watch.db
poll_interval_minutes: 15
inventory_stale_days: 7
digest_interval_hours: 24

sources:
  cve_now: true
  hacker_news: true # The Hacker News security publication, not Hacker News/Y Combinator.
  osv: false # Optional independent exact npm name/version lookups.
  github: false
  github_token_env: GITHUB_TOKEN
  kev: false
  feeds: [] # Optional additional public HTTPS RSS/Atom feeds.

models:
  enabled: false
  daily_request_limit: 100
  daily_token_limit: 100000
  max_input_chars: 12000
  max_output_tokens: 1500
  timeout_seconds: 45
  # Enable AI to distinguish an impacted system from general news about it.
  # Set enabled: true, provide credentials, and configure your exact model ID:
  # analysis:
  #   provider: openai
  #   model: YOUR_MODEL_ID
  #   api_key_env: OPENAI_API_KEY
  # verification:
  #   provider: anthropic
  #   model: YOUR_REVIEW_MODEL_ID
  #   api_key_env: ANTHROPIC_API_KEY
  # A daily_budget_usd additionally requires input_usd_per_million and
  # output_usd_per_million on every model. No pricing means UNKNOWN cost.

policy:
  library:
    levels: [critical]
    basis: source_severity
    channels: [] # Choose [slack], [email], or [slack, email] and configure below.
  product:
    levels: [high, critical]
    basis: priority
    channels: []
  news:
    levels: [high, critical]
    basis: priority
    channels: []
  urgent_unknown: true
  exploited_override: true
  malware_override: true
  health_channels: [] # Recommended: a working channel for monitoring failures.

notifications:
  max_attempts: 3
  # slack:
  #   webhook_url_env: SLACK_WEBHOOK_URL
  # email:
  #   smtp_url_env: SMTP_URL
  #   from: security-watch@example.com
  #   to: [security@example.com]
