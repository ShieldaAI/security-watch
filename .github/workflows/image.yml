name: Container image
run-name: Container image ${{ inputs.tag || github.ref_name }}
# Publishes ghcr.io/shieldaai/security-watch for each release tag: tested and checked natively on
# linux/amd64 and linux/arm64, with an SBOM and build provenance attached, and a signed GitHub build
# provenance attestation. The repository allows only GitHub's own actions, so building, pushing and
# tagging use the Docker CLI that the hosted runners include.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish again, v1.4.0 or later (earlier versions have no MCP server or labels)
        required: true
permissions:
  contents: read
concurrency:
  group: image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/shieldaai/security-watch
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Check the tag against package.json
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi
          tags="$IMAGE:$version"
          # A pre-release (1.4.0-rc.1) gets only its own tag. A release moves x.y when it is the newest
          # of its line, and latest when it is the newest of all, so publishing an older tag again
          # (workflow_dispatch) never moves them back.
          stable="$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/v##' | grep -Ev -- '-' | sort -V)"
          case "$version" in
            *-*) ;;
            *)
              [ "$(printf '%s\n' "$stable" | grep -E "^${version%.*}\." | tail -1)" = "$version" ] && tags="$tags,$IMAGE:${version%.*}"
              [ "$(printf '%s\n' "$stable" | tail -1)" = "$version" ] && tags="$tags,$IMAGE:latest"
              ;;
          esac
          echo "Tags: $tags"
          {
            echo "version=$version"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

  # Each architecture is built, tested and checked on its own hardware (no emulation), then pushed by
  # digest only: no tag points at it until both have passed.
  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Run the test suite in the build image
        run: docker build --target test -t security-watch:tests .
      - name: Build the image and check it before anything is pushed
        run: |
          docker build --build-arg VERSION="$VERSION" -t security-watch:candidate .
          node scripts/check-docker.mjs security-watch:candidate
          test "$(docker run --rm security-watch:candidate --version)" = "$VERSION"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}' security-watch:candidate)" = io.github.ShieldaAI/security-watch
      - name: Sign in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Push by digest, with an SBOM and build provenance
        id: push
        run: |
          # Attestations and push-by-digest need a BuildKit container builder.
          docker buildx create --name release --driver docker-container --use
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg VERSION="$VERSION" \
            --sbom=true \
            --provenance=mode=max \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json \
            .
          digest="$(node -p 'require("./metadata.json")["containerimage.digest"]')"
          case "$digest" in sha256:*) ;; *) echo "::error::No digest in the build metadata."; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          mkdir -p digests
          printf '%s\n' "$digest" > "digests/${{ matrix.arch }}"
      - name: Run the pushed image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          test "$(docker run --rm "$IMAGE@$DIGEST" --version)" = "$VERSION"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_dependencies","arguments":{}}}' |
            timeout 120 docker run -i --rm -v "$PWD:/project:ro" "$IMAGE@$DIGEST" mcp /project > mcp.jsonl || true
          grep -q '"id":2' mcp.jsonl
          echo "${{ matrix.platform }}: $VERSION, the MCP server answers"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAGS: ${{ needs.version.outputs.tags }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Sign in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Join both architectures under the version tag
        id: index
        run: |
          amd64="$(cat digests/amd64)"
          arm64="$(cat digests/arm64)"
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$amd64" "$IMAGE@$arm64"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          case "$digest" in sha256:*) ;; *) echo "::error::Could not read the index digest."; exit 1 ;; esac
          # Each source is an index (image and attestations); the joined one must hold both platforms.
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw | node -e '
            const index = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const found = new Set((index.manifests || []).map((m) => m.platform && `${m.platform.os}/${m.platform.architecture}`));
            for (const p of ["linux/amd64", "linux/arm64"]) if (!found.has(p)) { console.error(`missing ${p}`); process.exit(1); }'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance (signed through Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: Move the release-line and latest tags to the attested image
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          for tag in ${TAGS//,/ }; do
            [ "$tag" = "$IMAGE:$VERSION" ] && continue
            # One source is copied as it is, so the tag names the same digest that was attested.
            docker buildx imagetools create --tag "$tag" "$IMAGE@$DIGEST"
          done
          for tag in ${TAGS//,/ }; do
            test "$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')" = "$DIGEST"
          done
      - name: Summary
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          {
            echo "### $IMAGE:$VERSION"
            echo
            echo "Digest: \`$DIGEST\` (linux/amd64, linux/arm64). Tags: ${TAGS//,/, }"
            echo
            echo '```sh'
            echo "docker pull $IMAGE:$VERSION"
            echo "gh attestation verify oci://$IMAGE:$VERSION --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
