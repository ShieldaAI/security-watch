name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [24, 26]
        include:
          # Linux and macOS are the supported platforms; the Docker stages run on Linux only.
          - os: macos-latest
            node: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Enforce the coverage floor
        if: matrix.node == 24
        run: npm run test:coverage
      - name: Evaluate false dismissals and alert workload
        id: outcome_evaluation
        if: matrix.node == 24
        run: npm run evaluate:outcomes -- --output alert-evaluation.json
      - name: Retain alert evaluation evidence
        if: always() && matrix.node == 24 && steps.outcome_evaluation.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alert-outcome-evaluation
          path: alert-evaluation.json
          if-no-files-found: error
          retention-days: 7
      - name: Send this repository's SBOM to a local receiver through the action's script
        if: matrix.node == 24
        run: |
          export SECURITY_WATCH_INTAKE_TOKEN="$(openssl rand -hex 32)"
          mkdir -p .intake-ci/sboms
          printf 'sbom_directory: ./sboms\n' > .intake-ci/systems.yaml
          printf 'version: 1\ninventory: ./systems.yaml\nintake:\n  listen: 127.0.0.1:8787\n' > .intake-ci/security-watch.yaml
          node dist/cli.js intake --config .intake-ci/security-watch.yaml &
          receiver=$!
          for attempt in $(seq 50); do curl -fsS http://127.0.0.1:8787/healthz && break; sleep 0.2; done
          SW_PACKAGE=unused SW_CLI="node $PWD/dist/cli.js" SW_PROJECT=. SW_OUTPUT=sbom.cdx.json \
            SW_SYSTEM_ID=security-watch SW_UPLOAD_URL=http://127.0.0.1:8787 bash scripts/action-sbom.sh
          kill "$receiver"
          node dist/cli.js doctor --config .intake-ci/security-watch.yaml |
            node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8")); if (r.systems !== 1 || !r.components) process.exit(1)'
      - name: Rehearse isolated delivery and recovery
        id: local_rehearsal
        if: matrix.node == 24
        run: |
          node dist/cli.js init --directory .rehearsal-ci --yes --notifications slack
          node dist/cli.js rehearse --config .rehearsal-ci/security-watch.yaml --input examples/rehearsal.json --sink accepted --output rehearsal-evidence.json
      - name: Retain redacted rehearsal evidence
        if: always() && matrix.node == 24 && steps.local_rehearsal.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-rehearsal
          path: rehearsal-evidence.json
          if-no-files-found: error
          retention-days: 7
      - if: matrix.node == 24
        run: docker build --target test -t security-watch:tests .
      - if: matrix.node == 24
        run: docker build -t security-watch:test .
      - if: matrix.node == 24
        run: node scripts/check-docker.mjs security-watch:test
  packed-consumer:
    name: Packed consumer on Node 24.10.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.10.0
      - run: npm run check:package
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
