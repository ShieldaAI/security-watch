name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [24, 26]
        include:
          # Linux and macOS are the supported platforms; the Docker stages run on Linux only.
          - os: macos-latest
            node: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Enforce the coverage floor
        if: matrix.node == 24
        run: npm run test:coverage
      - name: Evaluate false dismissals and alert workload
        id: outcome_evaluation
        if: matrix.node == 24
        run: npm run evaluate:outcomes -- --output alert-evaluation.json
      - name: Retain alert evaluation evidence
        if: always() && matrix.node == 24 && steps.outcome_evaluation.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alert-outcome-evaluation
          path: alert-evaluation.json
          if-no-files-found: error
          retention-days: 7
      - name: Rehearse isolated delivery and recovery
        id: local_rehearsal
        if: matrix.node == 24
        run: |
          node dist/cli.js init --directory .rehearsal-ci --yes --notifications slack
          node dist/cli.js rehearse --config .rehearsal-ci/security-watch.yaml --input examples/rehearsal.json --sink accepted --output rehearsal-evidence.json
      - name: Retain redacted rehearsal evidence
        if: always() && matrix.node == 24 && steps.local_rehearsal.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-rehearsal
          path: rehearsal-evidence.json
          if-no-files-found: error
          retention-days: 7
      - if: matrix.node == 24
        run: docker build --target test -t security-watch:tests .
      - if: matrix.node == 24
        run: docker build -t security-watch:test .
      - if: matrix.node == 24
        run: node scripts/check-docker.mjs security-watch:test
  packed-consumer:
    name: Packed consumer on Node 24.10.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.10.0
      - run: npm run check:package
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
